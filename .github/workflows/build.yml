name: Build macOS App
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Sign Locally
        run: |
          # Compiles the full native app bundle while forcefully bypassing developer team identity blocks
          xcodebuild -project "wifi-signal-macos.xcodeproj" \
                     -scheme "wifi-signal-macos" \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Create DMG Container
        run: |
          mkdir -p build_output
          # Locates the true built Xcode app structure and transfers it safely into a container folder
          cp -R build/Release/wifi-signal-macos.app build_output/
          hdiutil create -volname "wifi-signal-macos" -srcfolder build_output -ov -format UDZO wifi-signal-macos.dmg

      - name: Upload Finished DMG File
        uses: actions/upload-artifact@v4
        with:
          name: working-mac-app
          path: wifi-signal-macos.dmg
