name: Build macOS App
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Swift Code Directly
        run: |
          mkdir -p build_output/wifi-signal-macos.app/Contents/MacOS
          # Find all Swift files and compile them straight into a binary executable
          find . -name "*.swift" -print0 | xargs -0 xcrun -sdk macosx swiftc -o build_output/wifi-signal-macos.app/Contents/MacOS/wifi-signal-macos
          
          # Create the required minimal macOS Info.plist framework structure
          cat <<EOF > build_output/wifi-signal-macos.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>wifi-signal-macos</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudbuild.wifisignal</string>
              <key>CFBundleName</key>
              <string>wifi-signal-macos</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSUIElement</key>
              <string>1</string>
          </dict>
          </plist>
          EOF

      - name: Create DMG File
        run: |
          hdiutil create -volname "wifi-signal-macos" -srcfolder build_output -ov -format UDZO wifi-signal-macos.dmg

      - name: Upload Finished DMG File
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mac-app
          path: wifi-signal-macos.dmg
