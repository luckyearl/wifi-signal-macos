name: Build macOS App
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with Custom Output Path
        run: |
          # Forces Xcode to place the output file inside a predictable folder we can reach
          xcodebuild -project "wifi-signal-macos.xcodeproj" \
                     -scheme "wifi-signal-macos" \
                     -configuration Release \
                     -derivedDataPath custom_build_folder \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Create DMG Container
        run: |
          mkdir -p build_output
          # Copies the app from the custom path into our final staging folder
          cp -R custom_build_folder/Build/Products/Release/wifi-signal-macos.app build_output/
          hdiutil create -volname "wifi-signal-macos" -srcfolder build_output -ov -format UDZO wifi-signal-macos.dmg

      - name: Upload Finished DMG File
        uses: actions/upload-artifact@v4
        with:
          name: working-mac-app
          path: wifi-signal-macos.dmg
