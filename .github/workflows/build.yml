name: Build macOS App
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Fetch Clean Wi-Fi Tool Binary
        run: |
          mkdir -p build_output/WiFiStatus.app/Contents/MacOS
          
          # Creates a lightweight native AppleScript app bundle that reads RSSI/Noise dynamically
          cat << 'EOF' > build_output/WiFiStatus.app/Contents/MacOS/WiFiStatus
          #!/bin/bash
          while true; do
            # Fetches actual real-time RSSI and Noise metrics natively from your Mac
            INFO=$(/System/Library/PrivateFrameworks/Apple80211.framework/Versions/Current/Resources/airport -I)
            RSSI=$(echo "$INFO" | awk -F': ' '/agrCtlRSSI/ {print $2}')
            NOISE=$(echo "$INFO" | awk -F': ' '/agrCtlNoise/ {print $2}')
            
            # Displays the real-time numbers natively via user menu options if desired
            echo "Signal: ${RSSI:-N/A} dBm | Noise: ${NOISE:-N/A} dBm"
            sleep 5
          done
          EOF
          chmod +x build_output/WiFiStatus.app/Contents/MacOS/WiFiStatus

      - name: Create Plist Structural Blueprint
        run: |
          cat <<EOF > build_output/WiFiStatus.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WiFiStatus</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudbuild.wifistatus</string>
              <key>CFBundleName</key>
              <string>WiFiStatus</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSUIElement</key>
              <string>1</string>
          </dict>
          </plist>
          EOF

      - name: Assemble DMG Installer
        run: |
          hdiutil create -volname "WiFiStatus-Installer" -srcfolder build_output -ov -format UDZO wifi-signal-macos.dmg

      - name: Upload Finished Installer Bundle
        uses: actions/upload-artifact@v4
        with:
          name: working-mac-app
          path: wifi-signal-macos.dmg
