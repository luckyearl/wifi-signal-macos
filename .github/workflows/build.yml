name: Build and Release macOS App
on: [workflow_dispatch]

permissions:
  contents: write # Grants the cloud runner permission to publish a release to your repo

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Universal Swift Menu Bar App
        run: |
          mkdir -p build_output/WiFiStats.app/Contents/MacOS
          
          cat << 'EOF' > main.swift
          import AppKit
          import CoreWLAN

          class MenuAppDelegate: NSObject, NSApplicationDelegate {
              var statusItem: NSStatusItem?
              var timer: Timer?

              func applicationDidFinishLaunching(_ notification: Notification) {
                  statusItem = NSStatusBar.system.statusItem(withLength: NSStatusItem.variableLength)
                  statusItem?.button?.title = "📡 ..."
                  
                  timer = Timer.scheduledTimer(withTimeInterval: 3.0, repeats: true) { _ in
                      self.updateWiFiMetrics()
                  }
                  timer?.fire()
              }

              func updateWiFiMetrics() {
                  guard let interface = CWWiFiClient.shared().interface() else { return }
                  let rssi = interface.rssiValue()
                  let noise = interface.noiseMeasurement()
                  
                  DispatchQueue.main.async {
                      self.statusItem?.button?.title = "S:\(rssi) N:\(noise)"
                  }
              }
          }

          let app = NSApplication.shared
          let delegate = MenuAppDelegate()
          app.delegate = delegate
          app.run()
          EOF

          xcrun -sdk macosx swiftc main.swift -target x86_64-apple-macos14 -o binary_intel
          xcrun -sdk macosx swiftc main.swift -target arm64-apple-macos14 -o binary_arm64
          lipo -create binary_intel binary_arm64 -output build_output/WiFiStats.app/Contents/MacOS/WiFiStats

      - name: Build Application Info Blueprint
        run: |
          cat <<EOF > build_output/WiFiStats.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WiFiStats</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudbuild.wifistats</string>
              <key>CFBundleName</key>
              <string>WiFiStats</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSUIElement</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

      - name: Build DMG Container
        run: |
          hdiutil create -volname "WiFiStats" -srcfolder build_output -ov -format UDZO WiFiStats.dmg

      - name: Generate Dynamic Version Tag
        id: tag
        run: echo "release_tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Release ${{ steps.tag.outputs.release_tag }}
          body: |
            ### WiFiStats Universal Build
            Successfully compiled for both Intel (x86_64) and Apple Silicon (arm64) architectures.
            Bypasses Gatekeeper (requires 'Open Anyway' in System Settings).
          files: WiFiStats.dmg
